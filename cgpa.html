<!DOCTYPE html>
<html>
<head>
    <title>CGPA Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>📝 CGPA Calculator</h1>

    <h2>Enter Your Details</h2>

    <label>Subject 1 Grade Point:</label>
    <input type="number" id="s1" min="0" max="10">
    <br><br>

    <label>Subject 2 Grade Point:</label>
    <input type="number" id="s2" min="0" max="10">
    <br><br>

    <label>Subject 3 Grade Point:</label>
    <input type="number" id="s3" min="0" max="10">
    <br><br>

    <label>Subject 4 Grade Point:</label>
    <input type="number" id="s4" min="0" max="10">
    <br><br>

    <label>Subject 5 Grade Point:</label>
    <input type="number" id="s5" min="0" max="10">
    <br><br>

    <button onclick="calculateCGPA()">Calculate CGPA</button>

    <h2 id="result"></h2>

    <script>
        function calculateCGPA() {
            let s1 = Number(document.getElementById("s1").value);
            let s2 = Number(document.getElementById("s2").value);
            let s3 = Number(document.getElementById("s3").value);
            let s4 = Number(document.getElementById("s4").value);
            let s5 = Number(document.getElementById("s5").value);

            let cgpa = (s1 + s2 + s3 + s4 + s5) / 5;

            document.getElementById("result").innerHTML =
                "Your CGPA is: " + cgpa.toFixed(2);
        }
    </script>

</body>
</html>
